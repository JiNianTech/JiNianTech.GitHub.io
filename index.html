<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1628" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="iPhone诊断" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

  <link rel="stylesheet" href="/src/styles/global.css" />

<body>
  <div id="app">
    <main id="page-content"></main>
    <nav id="tabbar" class="tabbar">
      <button class="tabbar-item active" data-route="/">
        <span class="tabbar-icon">🔬</span>
        <span class="tabbar-label">诊断</span>
      </button>
      <button class="tabbar-item" data-route="/history">
        <span class="tabbar-icon">📋</span>
        <span class="tabbar-label">记录</span>
      </button>
      <button class="tabbar-item" data-route="/knowledge">
        <span class="tabbar-icon">📚</span>
        <span class="tabbar-label">知识库</span>
      </button>
    </nav>
  </div>

  <!-- 全局组件容器 -->
  <div id="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="loading-overlay" class="loading-overlay hidden"></div>

  <script type="module" src="/src/main.js"></script>

</html>
